[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plagiarism_engine"
version = "1.0.0"
description = "Semantic Plagiarism Detection Engine using MinHash+LSH and SimHash"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "nltk>=3.6.0",
    "datasets>=2.0.0",
    "scipy>=1.7.0"
]

[project.scripts]
plagiarism-engine = "src.plagiarism_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]